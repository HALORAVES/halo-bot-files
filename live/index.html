<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HALO LIVE</title>
<style>
:root{--y:#ffff00;--g:#c9a227;--w:#f0f0e6;--m:#8a8a80}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--w);font:14px/1.4 "Barlow Condensed","Oswald","Arial Narrow",Impact,sans-serif}
#top{position:sticky;top:0;z-index:20;background:#000;border-bottom:2px solid var(--y);padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#wm{color:var(--g);letter-spacing:.3em;font-size:12px;font-weight:800}#count{font-size:clamp(30px,6vw,56px);font-weight:900;color:var(--y);line-height:1}
#prog{flex:1;min-width:160px}#bar{height:10px;border:1px solid var(--g)}#fill{height:100%;background:var(--y);width:0;transition:width .6s}#upd{font-size:12px;color:var(--m);margin-top:4px}
button,.btn{background:#000;color:var(--y);border:1.5px solid var(--y);font:700 12px Arial;letter-spacing:.08em;padding:7px 9px;cursor:pointer;text-transform:uppercase}
button:hover,button.on{background:var(--y);color:#000}button.keep{border-color:var(--g);color:var(--g)}button.keep.on{background:var(--g);color:#000}
#wrap{display:flex}
#nav{width:250px;flex:none;height:calc(100vh - 84px);position:sticky;top:84px;overflow:auto;border-right:1px solid #222;padding:6px 0 40px}
#nav h4{margin:14px 14px 4px;color:var(--g);font-size:12px;letter-spacing:.2em}
#nav .b{display:flex;justify-content:space-between;padding:5px 14px;cursor:pointer;color:#ddd;text-transform:uppercase;font-size:14px;white-space:nowrap}
#nav .b:hover{background:#111;color:var(--y)}#nav .b.act{background:var(--y);color:#000;font-weight:800}#nav .b .n{opacity:.6;font-size:12px;margin-left:8px}
#main{flex:1;min-width:0;padding:18px 22px 80px;transition:opacity .18s}#main.fade{opacity:0}
.head h1{margin:0;color:var(--y);font-size:clamp(34px,5vw,56px);line-height:.95;text-transform:uppercase}.head .law{font-size:19px;margin:8px 0 2px;max-width:1000px}.head .sub{color:var(--m);font-size:14px}
#grid{columns:4 260px;column-gap:14px;margin-top:16px}#grid.ups{columns:1}
.t{break-inside:avoid;margin:0 0 14px;border:1px solid #2a2a2a;border-top:2px solid var(--g);background:#070707;max-width:1000px}
.t img{width:100%;display:block}.t img.main{cursor:zoom-in}.i{padding:9px}.ti{font-weight:800;color:#fff;font-size:16px}.th{color:var(--g);font-size:11px;letter-spacing:.15em;text-transform:uppercase}
.st{float:right;font:800 10px Arial;padding:2px 6px;border:1px solid var(--m);color:var(--m);letter-spacing:.1em}.st.build{border-color:#0ff;color:#0ff}.st.keep{background:var(--g);color:#000;border-color:var(--g)}.st.nay{border-color:#f0f;color:#f0f}
.v{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.s{display:block;margin-top:6px;color:var(--y);font-size:13px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:4px}.ba figure{margin:0;position:relative}
.ba figcaption{z-index:2;position:absolute;top:6px;left:6px;background:#000;color:var(--y);font:800 11px Arial;letter-spacing:.2em;padding:3px 6px;border:1px solid var(--y)}
.ba figure:first-child figcaption{color:#fff;border-color:#fff}.vt{background:var(--y);color:#000;padding:1px 6px;font-weight:900;margin-right:6px}.nt{color:#ddd;margin-top:6px;font-size:14px}
.empty{color:var(--m);border:1px dashed #333;padding:30px;text-align:center;font-size:16px}
#pend{border-color:var(--g);color:var(--g)}
@media(max-width:760px){#wrap{display:block}#nav{width:auto;height:auto;position:sticky;top:0;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid #333;padding:0;background:#000;z-index:15}
#nav h4{display:none}#nav .b{padding:10px 12px;font-size:13px}#top{position:static}#main{padding:12px}.ba{grid-template-columns:1fr}}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;z-index:50;overflow:auto;padding:12px;gap:14px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
#stage{position:relative;max-width:min(96vw,900px)}#stage img{display:block;max-width:100%;max-height:86vh;border:1px solid #c9a227}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#fb{width:min(96vw,340px);border:1px solid #c9a227;padding:12px;background:#050505}#fb h3{margin:0 0 8px;color:#ff0;font-size:13px;letter-spacing:.2em}
#fb textarea{width:100%;height:90px;background:#000;color:#fff;border:1px solid #444;padding:6px}#fb label{display:block;margin:10px 0 4px;color:#c9a227;font-size:11px;letter-spacing:.15em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sw{width:26px;height:26px;padding:0}#drop{border:1px dashed #666;padding:10px;text-align:center;color:#888;font-size:12px}
#refs img{height:56px;margin:4px 4px 0 0;border:1px solid #444}#close{position:fixed;top:10px;right:14px;z-index:51}#send{width:100%;margin-top:12px;padding:12px;font-size:13px;background:#ff0;color:#000}
#fbmsg{font-size:12px;margin-top:6px;color:#aaa}#fbmsg a{color:#ff0}
.kp{display:inline-block;font:800 9px Arial;letter-spacing:.08em;padding:2px 7px;border-radius:9px;margin:0 0 5px;color:#000}.kp.client{background:#ff3fa4}.kp.general{background:#9ad7ff}.kp.event{background:#ffb000}.kf{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px}.kf button{font:800 10px Arial;padding:3px 7px}#lbk{position:absolute;top:12px;left:12px;z-index:5}.rf{font:10px Arial;margin:4px 0;line-height:1.5}.rf a{color:#9ad7ff;margin-right:8px;text-decoration:underline}#lbr{margin:6px 0}</style></head><body>
<div id="top"><div><div id="wm">HALO STILLS — LIVE</div><div id="count">0 / 150 KEPT</div></div>
<div id="prog"><div id="bar"><div id="fill"></div></div><div id="upd">loading…</div></div>
<button id="pend">SEND ALL PENDING (0)</button><button id="exp">EXPORT VOTES</button></div>
<div id="wrap"><nav id="nav"></nav><main id="main"><div class="head" id="head"></div><div id="grid"></div></main></div>
<div id="lb"><button id="close">✕ CLOSE</button><div id="stage"><span id="lbk"></span><img id="lbimg"><canvas id="cv"></canvas></div>
<div id="fb"><h3 id="fbt">FEEDBACK</h3><div id="lbr"></div><label>WHAT TO BUILD ON</label><textarea id="note" placeholder="more chrome, bigger halo…"></textarea>
<label>DRAW ON IT</label><div class="row"><button class="sw" data-c="#ffff00" style="background:#ff0"></button><button class="sw" data-c="#ff00ff" style="background:#f0f"></button><button class="sw" data-c="#ffffff" style="background:#fff"></button>
<input id="bs" type="range" min="2" max="40" value="8"><button id="undo">UNDO</button><button id="clr">CLEAR</button></div>
<label>REFERENCE PHOTOS</label><div id="drop">tap to add · paste · drag images here<input id="file" type="file" accept="image/*" multiple style="display:none"></div><div id="refs"></div>
<button id="send">SEND FEEDBACK</button><div id="fbmsg"></div></div></div>
<script>
const REPO='HALORAVES/halo-bot-files',K='halo_live_votes',KK='halo_live_keeps',PK='halo_live_pending';
let votes=JSON.parse(localStorage.getItem(K)||'{}'),keeps=JSON.parse(localStorage.getItem(KK)||'{}'),pend=JSON.parse(localStorage.getItem(PK)||'[]'),sig='',M=null,room=decodeURIComponent(location.hash.slice(1))||'UPDATES';
const THEMES=[["MONO/LITH", "One impossible solid in open water or wild land, alone, with weather around it."], ["DREAM/COLLAGE", "Two scales in one frame, and neither one apologizes."], ["HEAD/OPEN", "The head is a container. Show what is inside it."], ["HIDE/SKIN", "Pattern grown, not drawn."], ["SMALL/LIFE", "The smallest animal, lit like a monument."], ["MATTER/TYPE", "The letter is made of the thing it says."], ["BENT/TYPE", "The word moves the way it means."], ["SIGN/MARK", "One mark, no explanation."], ["BITE/COLOR", "Appetite in one saturated color."], ["TAPE/DECK", "The machine that played it, kept as a relic."], ["TOY/SMILE", "A small grin with a hard edge."], ["ACID/GRADIENT", "Color that glows like a screen, not paint."], ["POSTER/GRID", "Type, grid, one image, no mercy."], ["POUR/DRIP", "Something solid lets go."], ["SIGNAL/NOISE", "The picture is the interference."]];
const NIGHTS=['time-ska','dead-punch','wizard-court','nina-break','disco-roller','spore-amen','game-piano-sands','pepper-jungle','pigs-fly','watts-void-bukem'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gh=(t,b)=>`https://github.com/${REPO}/issues/new?title=${encodeURIComponent(t)}&body=${encodeURIComponent(b||'Note (optional): ')}`;
function issue(id,v){return gh('vote: '+id+' '+v)}
const save=()=>{localStorage.setItem(K,JSON.stringify(votes));localStorage.setItem(KK,JSON.stringify(keeps));localStorage.setItem(PK,JSON.stringify(pend))};
const kof=it=>{if(it.kind)return[it.kind,it.kindLabel||it.kind.toUpperCase()];const r=it.rooms||[];const n=r.find(q=>/^(nights|events?):/.test(q));if(n||/^N_/.test(it.id)||it.theme==='NIGHTS')return['event','EVENT'+(n?' · '+n.split(':')[1]:'')];const c=r.find(q=>/^(clients?|prospects?):/.test(q));if(c)return['client','CLIENT · '+c.split(':')[1]];return['general','GENERAL']};
const refsH=it=>(it.refs&&it.refs.length)?`<div class="rf">REF: ${it.refs.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a>`).join('')}</div>`:'';
const pill=it=>{const[k,l]=kof(it);return`<span class="kp ${k}">${esc(l)}</span>`};
let kindF=localStorage.getItem('halo_kindf')||'all';
function all(){return M?[...M.items.map(x=>({...x})),...(M.updates||[]).map(x=>({...x,upd:1}))].filter(x=>kindF==='all'||kof(x)[0]===kindF):[]}
const VS={'yay':'keep','keep':'keep','build on':'build','nay':'nay'};
const stat=it=>{if(keeps[it.id])return 'keep';const v=votes[it.id];if(v&&VS[v])return VS[v];if(typeof fb!=='undefined'&&fb[it.id]&&(fb[it.id].note||'').trim()&&(!it.status||it.status==='review'))return 'build';return it.status||'review'};
const isRev=it=>stat(it)==='review';
const rms=it=>it.rooms||[];
function rooms(){const P=all(),live=P.filter(x=>stat(x)!=='nay'),R=[];
 R.push({g:'WALL',id:'UPDATES',name:'UPDATES',law:'Each new version beside the one before it, with the note that moved it.',f:x=>x.upd});
 R.push({g:'WALL',id:'KEEPERS',name:'KEEPERS',law:'The gallery. Only what earned a KEEP.',f:x=>stat(x)==='keep'});
 R.push({g:'WALL',id:'IN REVIEW',name:'IN REVIEW',law:'New pieces waiting on a call: KEEP, YAY, NAY or BUILD ON.',f:x=>isRev(x)});
 THEMES.forEach(([n,l])=>R.push({g:'THEMES',id:'t:'+n,name:n,law:l,f:x=>stat(x)!=='nay'&&rms(x).includes(n)}));
 NIGHTS.forEach(n=>R.push({g:'NIGHTS',id:'nights:'+n,name:n.replace(/-/g,' '),law:'haloraves.com/nights/'+n,f:x=>stat(x)!=='nay'&&rms(x).includes('nights:'+n)}));
 const other=new Set();P.forEach(x=>rms(x).forEach(r=>{if(r.includes(':')&&!r.startsWith('nights:'))other.add(r)}));
 [...other].sort().forEach(r=>{const[g,...n]=r.split(':');R.push({g:g.toUpperCase(),id:r,name:n.join(':'),law:'',f:x=>stat(x)!=='nay'&&rms(x).includes(r)})});
 R.forEach(r=>r.items=(r.id==='UPDATES'?P:live.concat(r.id==='IN REVIEW'||r.id==='KEEPERS'?[]:[])).filter(r.f));return R}
function nav(R){const n=document.getElementById('nav');let g='',h='';R.forEach(r=>{if(r.g!==g){g=r.g;h+=`<h4>${esc(g)}</h4>`}h+=`<div class="b${r.id===room?' act':''}" data-r="${esc(r.id)}">${esc(r.name)}<span class="n">${r.items.length}</span></div>`});
 h=`<div class="kf">${['all','client','general','event'].map(k=>`<button data-k="${k}" class="${kindF===k?'on':''}">${k.toUpperCase()}</button>`).join('')}</div>`+h;n.innerHTML=h;n.querySelectorAll('.kf button').forEach(b=>b.onclick=()=>{kindF=b.dataset.k;localStorage.setItem('halo_kindf',kindF);draw()});n.querySelectorAll('.b').forEach(b=>b.onclick=()=>go(b.dataset.r));const a=n.querySelector('.act');if(a&&innerWidth<=760)a.scrollIntoView({inline:'center',block:'nearest'})}
function go(r){room=r;history.replaceState(null,'','#'+encodeURIComponent(r));const mn=document.getElementById('main');mn.classList.add('fade');setTimeout(()=>{draw();mn.classList.remove('fade');scrollTo({top:0})},180)}
function b64img(im,f,it){if(!f)return;if(/\.b64$/.test(f)){fetch(f+'?v='+encodeURIComponent(M.updated)).then(r=>r.text()).then(t=>{im.src='data:image/jpeg;base64,'+t.trim();if(it)it._src=im.src})}else im.src=f}
function act(it,a){if(a==='keep'){if(keeps[it.id]){delete keeps[it.id];pend=pend.filter(p=>p!=='keep: '+it.id)}else{keeps[it.id]=1;pend.push('keep: '+it.id);open(gh('keep: '+it.id),'_blank')}}
 else{votes[it.id]=votes[it.id]===a?undefined:a;if(!votes[it.id])delete votes[it.id];else pend.push('vote: '+it.id+' '+a)}save();draw()}
function tile(it){const v=votes[it.id],st=stat(it),d=document.createElement('div');d.className='t';
 const bef=it.upd?all().find(x=>x.id===it.before_file):null;
 const pic=`<img class="main" alt="${esc(it.title||it.id)}">`;
 d.innerHTML=(it.upd?`<div class="ba"><figure><figcaption>BEFORE</figcaption><img class="bef"></figure><figure><figcaption>AFTER</figcaption>${pic}</figure></div>`:pic)+
 `<div class="i"><span class="st ${st}">${st.toUpperCase()}</span>${pill(it)}<div class="th">${it.upd?`<span class="vt">${esc(it.version)}</span>UPDATE OF ${esc(it.of)}`:esc(it.theme||rms(it).filter(r=>!r.includes(':')).join(' · '))}</div><div class="ti">${esc(it.title||it.id)}</div>${it.note?`<div class="nt">${it.upd?'FEEDBACK: ':''}${esc(it.note)}</div>`:''}
 ${refsH(it)}<div class="v"><button class="keep${keeps[it.id]?' on':''}" data-x="keep">KEEP</button>${['yay','nay','build on'].map(x=>`<button data-x="${x}" class="${v===x?'on':''}">${x.toUpperCase()}</button>`).join('')}<button data-x="fb">✎ FEEDBACK</button></div>${v?`<a class="s" target="_blank" href="${issue(it.id,v)}">→ send “${v}” to the bot</a>`:''}</div>`;
 const im=d.querySelector('img.main');im.onclick=()=>openLB(it);b64img(im,it.file,it);
 if(it.upd){const be=d.querySelector('img.bef');if(bef){b64img(be,bef.file);be.style.cursor='zoom-in';be.onclick=()=>openLB(bef)}}
 d.querySelectorAll('.v button').forEach(b=>b.onclick=()=>b.dataset.x==='fb'?openLB(it):act(it,b.dataset.x));return d}
function draw(){if(!M)return;const R=rooms();let r=R.find(x=>x.id===room);if(!r){room='UPDATES';r=R[0]}nav(R);
 const kept=all().filter(x=>stat(x)==='keep').length;document.getElementById('count').textContent=`${kept} / ${M.total} KEPT · ${all().filter(isRev).length} IN REVIEW`;document.getElementById('fill').style.width=Math.min(100,100*kept/M.total)+'%';
 document.getElementById('pend').textContent=`SEND ALL PENDING (${pend.length})`;
 document.getElementById('head').innerHTML=`<h1>${esc(r.name)}</h1><div class="law">${esc(r.law)}</div><div class="sub">${r.items.length} piece${r.items.length==1?'':'s'}</div>`;
 const g=document.getElementById('grid');g.className=r.id==='UPDATES'?'ups':'';g.innerHTML='';
 const L=[...r.items].sort((a,b)=>String(b.updated||'').localeCompare(String(a.updated||'')));
 if(!L.length)g.innerHTML='<div class="empty">Nothing in this room yet. New pieces land here as they are made.</div>';L.forEach(it=>g.appendChild(tile(it)))}
async function load(){try{const m=await(await fetch('manifest.json?t='+Date.now(),{cache:'no-store'})).json();
 document.getElementById('upd').textContent='last updated '+new Date(m.updated).toLocaleString()+' · auto-refresh 30s';
 const s=JSON.stringify(m);if(s!==sig){sig=s;M=m;draw()}}catch(e){document.getElementById('upd').textContent='refresh failed, retrying…'}}
document.getElementById('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({votes,keeps},null,2)],{type:'application/json'}));a.download='halo_votes.json';a.click()};
document.getElementById('pend').onclick=()=>{if(!pend.length){alert('Nothing pending.');return}const body=pend.join('\n')+'\n\nNote (optional): ';open(gh('votes: batch ('+pend.length+')',body),'_blank');pend=[];save();draw()};
const FK='halo_live_fb';let fb=JSON.parse(localStorage.getItem(FK)||'{}'),cur=null,col='#ffff00',strokes=[],refs=[];
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');
function saveFB(){if(!cur)return;fb[cur.id]={note:$('note').value,strokes,refs};if(typeof draw==='function')setTimeout(draw,0);try{localStorage.setItem(FK,JSON.stringify(fb))}catch(e){$('fbmsg').textContent='storage full: reference photos not saved'}}
function openLB(it){cur=it;const f=fb[it.id]||{};strokes=f.strokes||[];refs=f.refs||[];$('note').value=f.note||'';$('fbt').textContent='FEEDBACK · '+(it.title||it.id);$('lbk').innerHTML=pill(it);$('lbr').innerHTML=refsH(it);$('fbmsg').textContent='';
 const im=$('lbimg');im.onload=()=>{cv.width=im.naturalWidth;cv.height=im.naturalHeight;redraw()};if(it._src)im.src=it._src;else b64img(im,it.file,it);showRefs();$('lb').style.display='flex'}
$('close').onclick=()=>{saveFB();$('lb').style.display='none'};
function redraw(){cx.clearRect(0,0,cv.width,cv.height);cx.lineCap=cx.lineJoin='round';strokes.forEach(s=>{cx.strokeStyle=s.c;cx.lineWidth=s.w;cx.beginPath();s.p.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));if(s.p.length==1)cx.lineTo(s.p[0][0]+.1,s.p[0][1]);cx.stroke()})}
function pt(e){const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)*cv.width/r.width),Math.round((e.clientY-r.top)*cv.height/r.height)]}
let dn=false;cv.addEventListener('pointerdown',e=>{dn=true;cv.setPointerCapture(e.pointerId);const k=cv.width/cv.getBoundingClientRect().width;strokes.push({c:col,w:+$('bs').value*k,p:[pt(e)]});redraw()});
cv.addEventListener('pointermove',e=>{if(!dn)return;strokes[strokes.length-1].p.push(pt(e));redraw()});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{if(dn){dn=false;saveFB()}}));
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{col=b.dataset.c;document.querySelectorAll('.sw').forEach(x=>x.style.outline='');b.style.outline='2px solid #c9a227'});
$('undo').onclick=()=>{strokes.pop();redraw();saveFB()};$('clr').onclick=()=>{strokes=[];redraw();saveFB()};$('note').oninput=saveFB;
function addFiles(fs){[...fs].filter(f=>f.type.startsWith('image/')).forEach(f=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1200/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);refs.push(c.toDataURL('image/jpeg',.8));showRefs();saveFB()};i.src=r.result};r.readAsDataURL(f)})}
function showRefs(){$('refs').innerHTML='';refs.forEach((u,n)=>{const i=new Image();i.src=u;i.title='tap to remove';i.onclick=()=>{refs.splice(n,1);showRefs();saveFB()};$('refs').appendChild(i)})}
$('drop').onclick=()=>$('file').click();$('file').onchange=e=>addFiles(e.target.files);
$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};
document.addEventListener('paste',e=>{if($('lb').style.display=='flex')addFiles([...e.clipboardData.items].map(i=>i.getAsFile()).filter(Boolean))});
const ld=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});
$('send').onclick=async()=>{saveFB();const base=await ld($('lbimg').src),rs=await Promise.all(refs.map(ld)),H=base.naturalHeight;
 let W=base.naturalWidth;const sc=rs.map(i=>H/i.height);rs.forEach((i,n)=>W+=i.width*sc[n]+20);
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,W,H);g.drawImage(base,0,0);g.drawImage(cv,0,0);
 let x=base.naturalWidth+20;rs.forEach((i,n)=>{g.drawImage(i,x,0,i.width*sc[n],H);x+=i.width*sc[n]+20});
 const name='halo-feedback-'+cur.id+'.png',blob=await new Promise(r=>c.toBlob(r,'image/png')),file=new File([blob],name,{type:'image/png'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
 const v=votes[cur.id]||'feedback',url=`https://github.com/${REPO}/issues/new?title=${encodeURIComponent('feedback: '+cur.id+' '+v)}&body=${encodeURIComponent(($('note').value||'(no note)')+'\n\nDrag the downloaded '+name+' into this box.')}`;
 $('fbmsg').innerHTML=`Downloaded ${name}. <a target="_blank" href="${url}">Open GitHub issue →</a>`;
 if(navigator.canShare&&navigator.canShare({files:[file]})){const b=document.createElement('button');b.textContent='SHARE IMAGE';b.onclick=()=>navigator.share({files:[file],title:name}).catch(()=>{});$('fbmsg').appendChild(b)}
 window.open(url,'_blank')};

load();setInterval(load,30000);
</script></body></html>
